name: Nightly Opportunity Pipeline

on:
  schedule:
    # Every 4 hours: 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC
    - cron: '0 */4 * * *'
  workflow_dispatch:   # allows manual "Run workflow" from GitHub Actions tab

jobs:
  run-pipeline:
    name: Scan Drive & update master sheet
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Validate that all required secrets are present before running
      - name: Validate secrets
        run: |
          missing=""
          [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ] && missing="$missing GOOGLE_SERVICE_ACCOUNT_JSON"
          [ -z "$GOOGLE_DRIVE_FOLDER_ID" ]      && missing="$missing GOOGLE_DRIVE_FOLDER_ID"
          [ -z "$GOOGLE_SHEETS_ID" ]             && missing="$missing GOOGLE_SHEETS_ID"
          [ -z "$GIST_ID" ]                      && missing="$missing GIST_ID"
          [ -z "$GH_TOKEN" ]                     && missing="$missing GH_TOKEN"
          if [ -n "$missing" ]; then
            echo "❌ Missing required secrets:$missing"
            echo "Add them in: GitHub repo → Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "✅ All required secrets are present"
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Run nightly pipeline
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python pipeline_job.py
